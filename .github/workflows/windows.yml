# Builds Hunt for Windows (it has to be built on Windows): Hunt.exe, the pill
# with the hunter in it (Rust: core/ and window/), packed into
# PoopihuntSetup.exe with Inno Setup (windows/hunt.iss). publish-windows.sh
# starts it with a build number and puts the result on poopihunt.xyz; a push
# builds it too, as a check, without the debug channel.
name: Windows build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build number (publish-windows.sh fills it in; higher is newer)"
        default: "0"
      name:
        description: "Build name, as the window shows it"
        default: "test"
  push:
    branches: [main, rdp-private-test-update]
    paths: ["core/**", "window/**", "Cargo.toml", "Cargo.lock", "samples/**", "config.example.json", "windows/**",
            ".github/workflows/windows.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # only published builds (a build number) report to the debug channel
      PUBLISHED: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/rdp-private-test-update' && inputs.version != '0' }}
    steps:
      - uses: actions/checkout@v7

      # Hunt.exe is the same from build to build (its number is in build.json): the last
      # one is used again while its code is unchanged, built (a few minutes) when it isn't
      - name: Hunt.exe, from a build with this code
        id: hunt
        uses: actions/cache@v6
        with:
          path: target/release/Hunt.exe
          key: hunt-exe-${{ env.PUBLISHED }}-${{ hashFiles('core/**', 'window/**', 'Cargo.toml', 'Cargo.lock', 'windows/hunt.ico') }}

      - uses: Swatinem/rust-cache@v2
        if: steps.hunt.outputs.cache-hit != 'true'

      - name: The tests (the samples read by their colors, the hunt on a pretend screen)
        if: steps.hunt.outputs.cache-hit != 'true'
        run: cargo test --release --locked -p hunt-core

      - name: Hunt.exe
        env:
          VERSION: ${{ github.ref == 'refs/heads/rdp-private-test-update' && github.run_number || inputs.version || '0' }}
          NAME: ${{ github.ref == 'refs/heads/rdp-private-test-update' && 'RDP TEST' || inputs.name || 'test' }}
        run: |
          if (Test-Path target\release\Hunt.exe) { "Hunt.exe from a build with this code" }
          else {
            cargo build --release --locked -p hunt
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Force dist\Hunt\samples | Out-Null
          Copy-Item target\release\Hunt.exe dist\Hunt\Hunt.exe
          Copy-Item samples\*.png dist\Hunt\samples\  # for --diagnose: read like on the Mac?
          @{ version = [long]$env:VERSION; name = $env:NAME } | ConvertTo-Json -Compress | Set-Content dist\Hunt\build.json -Encoding ascii
          "{0:N1} MB Hunt.exe" -f ((Get-Item dist\Hunt\Hunt.exe).Length / 1MB)
          Get-Content dist\Hunt\build.json

      - name: Read the samples with Windows' text recognition
        continue-on-error: true
        env:
          HUNT_DEBUG: "0"
          HUNT_DATA: ${{ runner.temp }}\hunt
        # (Hunt.exe is a window's program: piped, PowerShell waits for it and shows what it says)
        run: dist\Hunt\Hunt.exe --diagnose --config config.example.json | Out-Host

      - name: Hunt.exe's window comes up
        env:
          HUNT_DATA: ${{ runner.temp }}\pill
          HUNT_CAPTURABLE: "1"  # it hides from screenshots otherwise (the hunter's too)
        run: |
          New-Item -ItemType Directory -Force $env:HUNT_DATA | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Picture($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:HUNT_DATA\$name.png")
          }
          Start-Process dist\Hunt\Hunt.exe -ArgumentList "--smoke", "--intro"
          Start-Sleep -Seconds 1.2; Picture "opening"  # the big Clodsire on its way (on OpenGL; none here)
          Start-Sleep -Seconds 1.8; Picture "screen"   # the pill
          # (it may have started again on Direct3D, as another process: smoke.txt says when it's done)
          for ($i = 0; $i -lt 40 -and -not (Test-Path "$env:HUNT_DATA\smoke.txt"); $i++) { Start-Sleep -Milliseconds 500 }
          Get-Content "$env:HUNT_DATA\hunt.log" -ErrorAction SilentlyContinue | Select-String "window"
          $smoke = Get-Content "$env:HUNT_DATA\smoke.txt" -ErrorAction SilentlyContinue
          $smoke
          if ("$smoke" -notmatch "^ok:") { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: pill
          path: ${{ runner.temp }}/pill/*.png
          retention-days: 3

      - name: PoopihuntSetup.exe
        env:
          NAME: ${{ inputs.name || 'test' }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DName=$env:NAME" windows\hunt.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "{0:N1} MB installed, {1:N1} MB setup" -f ((Get-ChildItem dist\Hunt -Recurse | Measure-Object Length -Sum).Sum / 1MB),
            ((Get-Item dist\PoopihuntSetup.exe).Length / 1MB)

      - uses: actions/upload-artifact@v7
        with:
          name: PoopihuntSetup
          path: dist/PoopihuntSetup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Hash installer for the private updater
        id: private_sha
        if: github.ref == 'refs/heads/rdp-private-test-update'
        shell: pwsh
        run: |
          $sha = (Get-FileHash -Path dist/PoopihuntSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The personal test branch creates a DRAFT release only. Draft assets are
      # not available as public downloads; leave this release unpublished.
      - name: Save personal RDP test build as a draft release
        if: github.ref == 'refs/heads/rdp-private-test-update'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rdp-private-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: RDP private test build ${{ github.run_number }}
          body: |
            Personal test build from the rdp-private-test-update branch, based on current upstream Poopihunt plus the reskin + gradient detection fix.

            build-version: ${{ github.run_number }}
            sha256: ${{ steps.private_sha.outputs.sha256 }}

            This is a DRAFT release for personal testing only. Do not publish it. RDP TEST builds automatically check these draft releases when a read-only GitHub token is configured in %LOCALAPPDATA%\Hunt\update-token.txt.
          draft: true
          prerelease: true
          make_latest: false
          files: dist/PoopihuntSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
